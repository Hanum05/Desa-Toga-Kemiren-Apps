        function navigateTo(tabId) {
            state.currentTab = tabId;
            const menuObj = MENUS.find(m => m.id === tabId) || MENUS[0];

            // Update Desktop Header
            document.getElementById('desktopBreadcrumb').textContent = `DESA TOGA KEMIREN • ${menuObj.subtitle}`;
            document.getElementById('desktopPageTitle').textContent = `${menuObj.label} — ${menuObj.desc}`;

            // Update Mobile Header
            document.getElementById('mobileHeaderSubtitle').textContent = `${menuObj.label} • ${menuObj.subtitle}`;

            // Update Desktop Active State
            document.querySelectorAll('[data-desktop-nav]').forEach(btn => {
                const isActive = btn.getAttribute('data-desktop-nav') === tabId;
                if (isActive) {
                    btn.className = 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-bold transition-all bg-gradient-to-r from-osing-700 to-osing-800 text-white shadow-md border border-osing-600/50';
                } else {
                    btn.className = 'w-full flex items-center justify-between px-3.5 py-2.5 rounded-xl text-sm font-medium transition-all text-osing-200 hover:bg-osing-900 hover:text-white group';
                }
            });

            // Update Mobile Bottom Tabs Active State
            document.querySelectorAll('.mobile-tab').forEach(btn => {
                const navTarget = btn.getAttribute('data-nav');
                const isMoreActive = navTarget === 'more' && !['beranda', 'osingpedia', 'jelajah', 'herbascience'].includes(tabId);
                if (navTarget === tabId || isMoreActive) {
                    btn.classList.remove('text-slate-500');
                    btn.classList.add('text-osing-700', 'font-bold');
                } else {
                    btn.classList.remove('text-osing-700', 'font-bold');
                    btn.classList.add('text-slate-500');
                }
            });

            // Render View
            const viewport = document.getElementById('appViewport');
            viewport.innerHTML = `<div class="view-section">${renderView(tabId)}</div>`;
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleMobileDrawer(show) {
            const drawer = document.getElementById('mobileMenuDrawer');
            if (show) {
                drawer.classList.remove('hidden');
            } else {
                drawer.classList.add('hidden');
            }
        }

                    p.localName.toLowerCase().includes(q) || 
                    p.osingName.toLowerCase().includes(q) ||

                    p.metabolites.some(m => m.toLowerCase().includes(q));

        // =============================================================
        // VIEW 8: PASAR OSING (UMKM Marketplace & Interactive Cart)
        // =============================================================
        function renderPasarOsing() {
            const categories = ['Semua', 'Minuman Herbal', 'Teh Rempah', 'Perawatan Alami', 'Paket Wisata'];
            const filteredProducts = PRODUCTS.filter(p => state.marketCategory === 'Semua' || p.category === state.marketCategory);

            const cartTotal = state.cart.reduce((sum, item) => {
                const prod = PRODUCTS.find(p => p.id === item.productId);
                return sum + (prod ? prod.price * item.qty : 0);
            }, 0);

            return `
                <div class="bg-white rounded-3xl p-5 sm:p-6 border border-slate-200 shadow-xs mb-6">
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 mb-4">
                        <div>
                            <span class="text-xs font-extrabold text-osing-700 uppercase tracking-wider">Local Herbal Product & UMKM Marketplace</span>
                            <h1 class="text-2xl font-extrabold text-slate-900 mt-0.5">PASAR OSING</h1>
                            <p class="text-sm text-slate-600">Produk herbal unggulan dan oleh-oleh wisata edukasi UMKM Desa Kemiren yang terintegrasi dengan HerbaGuard.</p>
                        </div>
                        <button onclick="openCartModal()" class="px-4 py-3 rounded-2xl bg-kunir-500 hover:bg-kunir-600 text-osing-950 font-extrabold text-xs flex items-center justify-center gap-2 shadow shrink-0">
                            <i class="fa-solid fa-bag-shopping"></i>
                            <span>Keranjang (${state.cart.reduce((a, b) => a + b.qty, 0)}) • Rp ${cartTotal.toLocaleString('id-ID')}</span>

                    </div>

                    <!-- Category Filter -->
                    <div class="flex gap-2 overflow-x-auto no-scrollbar pb-1">
                        ${categories.map(cat => `
                            <button onclick="state.marketCategory='${cat}'; refreshCurrentView();" 
                                class="px-4 py-1.5 rounded-full text-xs font-bold transition shrink-0 ${state.marketCategory === cat ? 'bg-osing-800 text-white' : 'bg-slate-100 text-slate-600 hover:bg-slate-200'}">
                                ${cat}
                            </button>
                        `).join('')}
                    </div>
                </div>

                <!-- Product Catalog Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-5">
                    ${filteredProducts.map(prod => `
                        <div class="bg-white rounded-3xl border border-slate-200/90 p-5 shadow-xs hover:shadow-md transition flex flex-col justify-between">
                            <div>
                                <div class="flex items-start justify-between gap-3 mb-4">
                                    <div class="w-14 h-14 rounded-2xl ${prod.color} flex items-center justify-center text-2xl shrink-0">
                                        <i class="fa-solid ${prod.icon}"></i>
                                    </div>
                                    <div class="text-right">
                                        <span class="inline-flex items-center gap-1 text-xs font-bold text-amber-600">
                                            <i class="fa-solid fa-star"></i> ${prod.rating} (${prod.sold} terjual)
                                        </span>
                                        <div class="mt-1">
                                            <button onclick="state.batchInput='${prod.batchCode}'; navigateTo('herbaguard');" 
                                                class="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-emerald-50 text-emerald-800 border border-emerald-200 hover:bg-emerald-100">
                                                <i class="fa-solid fa-shield-check"></i> ${prod.batchCode}

                                <p class="text-xs text-slate-600 leading-relaxed mb-4">${prod.desc}</p>

                                </div>

                                </button>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // -------------------------------------------------------------
        // 9. CART, QR SIMULATOR & MODAL HELPERS
        // -------------------------------------------------------------
        function addToCart(productId) {
            const existing = state.cart.find(c => c.productId === productId);
            if (existing) {
                existing.qty += 1;
            } else {
                state.cart.push({ productId, qty: 1 });
            }
            updateCartBadges();
            const prod = PRODUCTS.find(p => p.id === productId);
            showToast(`"${prod.name}" ditambahkan ke keranjang!`);
            if (state.currentTab === 'pasar') refreshCurrentView();
        }

        function updateCartQty(productId, delta) {
            const idx = state.cart.findIndex(c => c.productId === productId);
            if (idx === -1) return;
            state.cart[idx].qty += delta;
            if (state.cart[idx].qty <= 0) {
                state.cart.splice(idx, 1);
            }
            updateCartBadges();
            openCartModal();
            if (state.currentTab === 'pasar') refreshCurrentView();
        }

        function updateCartBadges() {
            const totalItems = state.cart.reduce((sum, item) => sum + item.qty, 0);
            const deskBadge = document.getElementById('desktopCartBadge');
            const mobBadge = document.getElementById('mobileCartBadge');
            if (deskBadge) deskBadge.textContent = totalItems;
            if (mobBadge) {
                mobBadge.textContent = totalItems;
                mobBadge.classList.toggle('hidden', totalItems === 0);
            }
        }

        function openCartModal() {
            const itemsHtml = state.cart.length === 0 ? `
                <div class="text-center py-8">
                    <i class="fa-solid fa-bag-shopping text-4xl text-slate-300 mb-2"></i>
                    <p class="text-sm font-bold text-slate-700">Keranjang belanja masih kosong</p>
                    <p class="text-xs text-slate-500 mt-1">Pilih produk herbal unggulan UMKM Desa Kemiren.</p>
                </div>
            ` : state.cart.map(item => {
                const p = PRODUCTS.find(prod => prod.id === item.productId);
                return `
                    <div class="flex items-center justify-between gap-3 p-3 rounded-2xl bg-slate-50 border border-slate-200">
                        <div class="min-w-0 flex-1">
                            <div class="font-bold text-xs sm:text-sm text-slate-900 truncate">${p.name}</div>
                            <div class="text-xs text-osing-700 font-semibold">Rp ${(p.price * item.qty).toLocaleString('id-ID')}</div>
                        </div>
                        <div class="flex items-center gap-2 shrink-0">
                            <button onclick="updateCartQty('${p.id}', -1)" class="w-7 h-7 rounded-lg bg-white border border-slate-300 text-xs font-bold">-</button>
                            <span class="text-xs font-extrabold w-5 text-center">${item.qty}</span>
                            <button onclick="updateCartQty('${p.id}', 1)" class="w-7 h-7 rounded-lg bg-osing-800 text-white text-xs font-bold">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            const total = state.cart.reduce((sum, item) => {
                const p = PRODUCTS.find(prod => prod.id === item.productId);
                return sum + (p ? p.price * item.qty : 0);
            }, 0);

            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <h3 class="text-lg font-extrabold text-slate-900">Keranjang Belanja Pasar Osing</h3>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                    </div>
                    <div class="space-y-2.5 max-h-72 overflow-y-auto">
                        ${itemsHtml}
                    </div>
                    ${state.cart.length > 0 ? `
                        <div class="pt-3 border-t border-slate-200 flex items-center justify-between">
                            <span class="text-sm font-bold text-slate-600">Total Estimasi:</span>
                            <span class="text-xl font-extrabold text-osing-900">Rp ${total.toLocaleString('id-ID')}</span>
                        </div>
                        <button onclick="checkoutOrder()" class="w-full py-3.5 rounded-2xl bg-osing-800 hover:bg-osing-900 text-white font-bold text-sm flex items-center justify-center gap-2 shadow">
                            <i class="fa-brands fa-whatsapp text-base"></i> Buat Pesanan ke Koperasi UMKM Kemiren
                        </button>
                    ` : ''}
                </div>
            `);
        }

        function checkoutOrder() {
            state.cart = [];
            updateCartBadges();
            closeModal();
            if (state.currentTab === 'pasar') refreshCurrentView();
            showToast('Pesanan berhasil dibuat & diteruskan ke admin UMKM Kemiren!');
        }

        function openQrSimulator(presetCode = '') {
            openModal(`
                <div class="space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <h3 class="text-lg font-extrabold text-slate-900">Simulasi Pemindai QR Code</h3>
                            <p class="text-xs text-slate-500">Pindai QR papan nama tanaman kebun atau kemasan produk UMKM</p>
                        </div>
                        <button onclick="closeModal()" class="w-8 h-8 rounded-full bg-slate-100 text-slate-600 flex items-center justify-center"><i class="fa-solid fa-xmark"></i></button>
                    </div>

                    <!-- Simulated Viewfinder -->
                    <div class="relative h-44 rounded-2xl bg-slate-900 flex flex-col items-center justify-center text-white overflow-hidden">
                        <div class="w-28 h-28 border-2 border-kunir-400 rounded-2xl flex items-center justify-center relative">
                            <i class="fa-solid fa-qrcode text-5xl text-white/80"></i>
                            <div class="absolute inset-x-0 top-1/2 h-0.5 bg-kunir-400 animate-pulse"></div>
                        </div>
                        <span class="text-[11px] text-slate-300 mt-3">Pilih simulasi QR di bawah untuk membuka data digital instan</span>
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        <button onclick="closeModal(); openPlantDetail('kunir-putih');" class="p-3 rounded-xl border border-osing-200 bg-osing-50 hover:bg-osing-100 text-left">
                            <div class="text-[10px] font-extrabold text-osing-700">QR PAPAN TANAMAN KEBUN</div>
                            <div class="text-xs font-bold text-slate-900 mt-0.5">Kunir Pethak (Curcuma zedoaria)</div>
                        </button>
                        <button onclick="closeModal(); openPlantDetail('daun-kelor');" class="p-3 rounded-xl border border-osing-200 bg-osing-50 hover:bg-osing-100 text-left">
                            <div class="text-[10px] font-extrabold text-osing-700">QR PAPAN TANAMAN KEBUN</div>
                            <div class="text-xs font-bold text-slate-900 mt-0.5">Godong Kelor (Moringa oleifera)</div>
                        </button>
                        <button onclick="closeModal(); state.batchInput='KMR-2026-001'; navigateTo('herbaguard');" class="p-3 rounded-xl border border-amber-200 bg-amber-50 hover:bg-amber-100 text-left">
                            <div class="text-[10px] font-extrabold text-amber-800">QR KEMASAN PRODUK UMKM</div>
                            <div class="text-xs font-bold text-slate-900 mt-0.5">Batch KMR-2026-001 (HerbaGuard)</div>
                        </button>
                        <button onclick="closeModal(); state.selectedSpotId='spot-2'; navigateTo('jelajah');" class="p-3 rounded-xl border border-blue-200 bg-blue-50 hover:bg-blue-100 text-left">
                            <div class="text-[10px] font-extrabold text-blue-800">QR TITIK WISATA EDUKASI</div>
                            <div class="text-xs font-bold text-slate-900 mt-0.5">Sanggar Racik Jamu Mbok Yem</div>
                        </button>
                    </div>
                </div>
            `);
        }

        function openModal(innerHtml) {
            const modal = document.getElementById('universalModal');
            document.getElementById('modalContentBox').innerHTML = innerHtml;
            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('universalModal').classList.add('hidden');
        }

        function refreshCurrentView() {
            document.getElementById('appViewport').innerHTML = `<div class="view-section">${renderView(state.currentTab)}</div>`;
        }

        let toastTimer;
        function showToast(msg) {
            const box = document.getElementById('toastBox');
            document.getElementById('toastMessage').textContent = msg;
            box.classList.remove('hidden');
            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => {
                box.classList.add('hidden');
            }, 3000);
        }

        // Boot App on Window Load
        window.onload = initApp;
    </script>
